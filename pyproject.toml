[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-as-code-forge"
version = "1.4.2"
description = "Detection-as-Code (DaC) CI/CD Validation, Testing, Profiling, and Multi-Target Transpilation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Engineering Team", email = "sec-eng@example.com" }
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.yamllint.rules]
line-length = { max = 180, level = "warning" }
document-start = "disable"
